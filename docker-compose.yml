
services:
  flows:
    image: "pactumjs/flows:latest"
    ports:
      - "8080:8080"
    environment:
      - "DB_HOST=mongo"
    depends_on:
      - mongo

  mongo:
    image: "mongo:4.2.12"

  test:
    build:
      context: .
    depends_on:
      - mongo
      - flows
    command: sh -c "npm run wdio"